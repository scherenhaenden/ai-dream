build-backend = "setuptools.build_meta"

[project]
name = "ai-dream"
version = "0.1.0"
description = "Local model catalog and inference manager"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
app = "aidream.cli:main"

[tool.setuptools.packages.find]
include = ["aidream*"]
