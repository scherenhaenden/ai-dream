name: Apply canvas modality changes

on:
  push:
    branches:
      - feature/chat-canvas-model-modalities

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/chat-canvas-model-modalities
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply source patch
        run: |
          python3 scripts/apply_canvas_modalities_patch.py
          python3 scripts/fix_canvas_smoke_fixture.py

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check templates
        working-directory: web
        run: npm run test:templates

      - name: Check model configuration contracts
        working-directory: web
        run: npm run test:models-config

      - name: Install Chromium for smoke tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Chat and agent smoke test
        working-directory: web
        run: npm run test:chat-agent-ui

      - name: Model Studio smoke test
        continue-on-error: true
        working-directory: web
        run: npm run test:model-studio-ui

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_canvas_modalities_patch.py scripts/fix_canvas_smoke_fixture.py .github/workflows/apply-canvas-modalities.yml
          git add web/src/app/pages/chat.page.ts \
                  web/src/app/pages/model-studio.page.ts \
                  web/src/styles.css \
                  web/scripts/check-chat-agent-ui.mjs
          git commit -m "feat: make chat canvas interactive and label model modalities"
          git push origin HEAD:feature/chat-canvas-model-modalities
